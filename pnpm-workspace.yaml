packages:
  - apps/*
  - packages/*

# D58: skip versions published less than three days ago.
minimumReleaseAge: 4320

# D58: only these packages may run install scripts.
allowBuilds:
  esbuild: true
  workerd: true
  # Hooks are installed by the root `prepare` script instead.
  lefthook: false
  # The binary comes from its platform package; its postinstall is not needed.
  "@sentry/cli": false
