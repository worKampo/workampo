name: e2e

# Only on PRs, and the suites run only for affected apps; a skipped run counts as passing (ADR-0029).
on:
  pull_request:

concurrency:
  group: e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # turbo --affected diffs against the base branch
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Packages without an e2e script show up in the dry run with the command <NONEXISTENT>.
      - id: affected
        shell: bash # -eo pipefail: a failing turbo must not read as zero tasks
        run: |
          count=$(pnpm turbo run e2e --affected --dry=json | jq '[.tasks[] | select(.command != "<NONEXISTENT>")] | length')
          echo "Affected e2e tasks: $count"
          echo "count=$count" >> "$GITHUB_OUTPUT"
      # Browsers are installed on every run, not cached: Playwright's advice.
      - if: steps.affected.outputs.count != '0'
        run: pnpm --filter @workampo/api exec playwright install --with-deps chromium
      - if: steps.affected.outputs.count != '0'
        run: pnpm turbo run e2e --affected
      - if: ${{ !cancelled() && steps.affected.outputs.count != '0' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/*/playwright-report/
          retention-days: 14
