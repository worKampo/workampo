name: backfill

# Manual: runs one backfill remotely (ADR-0044). prod waits for the person's approval on its Environment.
on:
  workflow_dispatch:
    inputs:
      name:
        description: Backfill file name in packages/db/backfills, without extension
        required: true
        type: string
      environment:
        description: Environment
        required: true
        type: choice
        options: [stg, prod]

permissions: {}

jobs:
  backfill:
    # Same group as the deploy of this environment: a backfill never overlaps a migration.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      BACKFILL_NAME: ${{ inputs.name }}
      TARGET_ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Inputs go through env variables, never interpolated into the script (injection).
      - run: node scripts/db/backfill.mjs "$BACKFILL_NAME" --env "$TARGET_ENV"
