name: deploy

# Staging after every merge; production with the same SHA once the person approves the prod Environment (ADR-0013, ADR-0023).
on:
  push:
    branches: [master]

permissions: {}

jobs:
  stg:
    # One group per environment: two deploys never migrate the same databases at once, a queued one
    # waits instead of cancelling, and a prod job waiting for approval does not hold back staging.
    concurrency:
      group: deploy-stg
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: stg
      url: https://app-stg.workampo.workers.dev
    permissions:
      contents: read
      issues: write
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff against the deployed SHA needs history
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: deploy
        run: node scripts/deploy/deploy.mjs stg
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - if: steps.deploy.outputs.deployed == 'true'
        run: node scripts/smoke/smoke.mjs https://app-stg.workampo.workers.dev "$GITHUB_SHA"
      - if: steps.deploy.outputs.deployed == 'true'
        run: node scripts/smoke/verification-comment.mjs stg https://app-stg.workampo.workers.dev "$GITHUB_SHA" "$FROM_SHA"
        # A failed comment must not block production.
        continue-on-error: true
        env:
          FROM_SHA: ${{ steps.deploy.outputs.from }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      # Board-only App: its token can only move cards; github.token cannot (ADR-0069).
      - id: board
        if: steps.deploy.outputs.observe == 'none' && vars.BOARD_APP_CLIENT_ID != ''
        # A failed token leaves the card by hand; it must not fail the deploy or the window.
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOARD_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOARD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-organization-projects: write
      # No Worker affected: no release to observe, so its tickets close here (ADR-0020).
      - if: steps.deploy.outputs.observe == 'none'
        run: node scripts/deploy/close-unobserved.mjs "$GITHUB_SHA" "$FROM_SHA"
        env:
          FROM_SHA: ${{ steps.deploy.outputs.from }}
          GH_TOKEN: ${{ github.token }}
          BOARD_TOKEN: ${{ steps.board.outputs.token }}

  prod:
    needs: stg
    # Nothing new in staging means nothing to approve; a lagging prod catches up on the next deploy.
    if: needs.stg.outputs.deployed == 'true'
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: prod
      url: https://app.workampo.workers.dev
    permissions:
      contents: read
      issues: write
      # Only to mark this run's own deployment when nothing was deployed (last step).
      deployments: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same SHA as staging; production computes its own diff against what it serves (ADR-0060).
      - id: deploy
        run: node scripts/deploy/deploy.mjs prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - if: steps.deploy.outputs.deployed == 'true'
        run: node scripts/smoke/smoke.mjs https://app.workampo.workers.dev "$GITHUB_SHA"
      - if: steps.deploy.outputs.deployed == 'true'
        run: node scripts/smoke/verification-comment.mjs prod https://app.workampo.workers.dev "$GITHUB_SHA" "$FROM_SHA"
        continue-on-error: true
        env:
          FROM_SHA: ${{ steps.deploy.outputs.from }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      # The job records a prod deployment even when deploy.mjs deployed nothing (a stale run). The
      # description must match NOTHING_DEPLOYED in scripts/observation/check.mjs, which then skips it.
      - if: steps.deploy.outcome == 'success' && steps.deploy.outputs.deployed != 'true'
        run: |
          id=$(gh api "repos/$GH_REPO/deployments?environment=prod&sha=$GITHUB_SHA&per_page=1" --jq '.[0].id')
          gh api -X POST "repos/$GH_REPO/deployments/$id/statuses" -f state=inactive -f description='workampo: nothing deployed' --silent
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
