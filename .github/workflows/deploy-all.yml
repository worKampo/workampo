name: deploy-all

# Manual: deploys every Worker to one environment, ignoring the affected diff (ADR-0060).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        required: true
        type: choice
        options: [stg, prod]

permissions: {}

jobs:
  deploy:
    # Same group as the deploy workflow's job for this environment.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      TARGET_ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The input goes through an env variable, never interpolated into the script (injection).
      - run: node scripts/deploy/deploy.mjs "$TARGET_ENV" --all
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - run: |
          url=$([ "$TARGET_ENV" = prod ] && echo https://app.workampo.workers.dev || echo https://app-stg.workampo.workers.dev)
          node scripts/smoke/smoke.mjs "$url" "$GITHUB_SHA"
