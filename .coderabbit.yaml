# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# AI review on every PR (D41): comments and suggests, never approves or blocks; the person approves.
language: es-ES
reviews:
  profile: chill
  request_changes_workflow: false
  auto_review:
    drafts: false
  path_filters:
    - "!pnpm-lock.yaml"
    - "!**/worker-configuration.d.ts"
  path_instructions:
    - path: "**"
      instructions: |
        Apply the review policy in docs/process/review.md (ADR-0015).
        This repository is public (D43): flag as a blocking issue any secret, token, personal data,
        real email address (other than the project's noreply and the test domains listed in docs/process/review.md, No entra) or customer data.
knowledge_base:
  code_guidelines:
    filePatterns:
      - docs/process/review.md
